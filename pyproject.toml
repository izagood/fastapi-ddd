[project]
name = "fastapi-ddd"
version = "0.1.0"
description = "Fastapi DDD with SQLAlchemy"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "izagood", email = "ljbfif50@gmail.com" }]
dependencies = [
    "fastapi[all]>=0.115.0",
    "gunicorn>=23.0.0",
    "uvicorn[standard]>=0.34.0",
    "loguru>=0.7.3",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.31.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.2.0",
    "pydantic-settings>=2.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.4",
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["fastapi_ddd"]
command_line = "-m pytest"

[tool.coverage.report]
ignore_errors = true
skip_empty = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
