[project]
name = "fastapi-ddd"
version = "0.1.0"
description = "Fastapi DDD with SQLAlchemy"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "izagood", email = "ljbfif50@gmail.com" }]
dependencies = [
    "fastapi[all]>=0.111.0",
    "gunicorn>=22.0.0",
    "uvicorn[standard]>=0.30.1",
    "loguru>=0.7.2",
    "sqlalchemy>=2.0.31",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.2",
    "bcrypt>=4.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.4",
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["fastapi_ddd"]
command_line = "-m pytest"

[tool.coverage.report]
ignore_errors = true
skip_empty = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
